<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Ibrahim: The Flight</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#111;--yellow:#ffd60a;--red:#e63946;--blue:#243b9b}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Comic Neue','Comic Sans MS',system-ui,sans-serif;font-weight:700;color:var(--ink);
    background-color:var(--blue);background-image:radial-gradient(rgba(255,255,255,.14) 22%,transparent 24%);background-size:16px 16px}
  .bang,.btn,.tag,.sfx,.title{font-family:'Bangers','Impact',sans-serif;font-weight:400;letter-spacing:.04em}
  #fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}

  .btn{font-size:24px;color:#fff;background:var(--red);border:4px solid var(--ink);padding:8px 26px;box-shadow:5px 5px 0 var(--ink);
    cursor:pointer;transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .tag{background:var(--yellow);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:5px 14px;transform:rotate(-2deg);font-size:clamp(18px,5.5vw,26px)}
  .cap{background:var(--yellow);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:9px 13px;max-width:min(92vw,440px);
    font-size:clamp(14px,3.9vw,17px);line-height:1.3;text-align:center}
  .burst,.sfx{clip-path:polygon(50% 0,61% 18%,80% 8%,78% 30%,98% 35%,84% 52%,98% 70%,78% 74%,80% 94%,61% 84%,50% 100%,39% 84%,20% 94%,22% 74%,2% 70%,16% 52%,2% 35%,22% 30%,20% 8%,39% 18%)}

  /* cover */
  #cover{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
    background-color:var(--blue);background-image:radial-gradient(rgba(255,255,255,.14) 22%,transparent 24%);background-size:16px 16px;transition:opacity .4s,visibility .4s}
  #cover.hide{opacity:0;visibility:hidden}
  #cover .burst{position:absolute;width:min(120vw,620px);aspect-ratio:1;background:var(--red);z-index:-1}
  .title{font-size:clamp(58px,19vw,104px);line-height:.95;color:var(--yellow);transform:rotate(-4deg);
    text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),6px 6px 0 var(--ink)}
  .banner{margin-top:26px;background:#fff;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:4px 16px;font-size:clamp(20px,6vw,28px);transform:rotate(2deg)}
  #cover .cap{margin-top:26px}
  #cover .btn{margin-top:18px}

  /* stage */
  #stage{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#4fb3ff,#bfe6ff 70%,#e9f7ff)}
  .cloud{position:absolute;left:0;width:92px;height:32px;background:#fff;border:3px solid var(--ink);border-radius:30px;z-index:1;
    animation:drift linear infinite;will-change:transform}
  .cloud::before{content:"";position:absolute;left:16px;top:-18px;width:38px;height:30px;background:#fff;border:3px solid var(--ink);border-bottom:0;border-radius:30px 30px 0 0}
  .cloud::after{content:"";position:absolute;left:46px;top:-11px;width:28px;height:22px;background:#fff;border:3px solid var(--ink);border-bottom:0;border-radius:30px 30px 0 0}
  @keyframes drift{from{transform:translateX(110vw)}to{transform:translateX(-160px)}}
  #stage.fast .cloud{animation-duration:3.5s!important}
  .place{position:absolute;left:0;bottom:14dvh;width:100%;height:24dvh;z-index:2}
  .place svg{width:100%;height:100%;display:block}
  .wheel{transform-origin:200px 80px;animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #ground{position:absolute;left:0;right:0;bottom:0;height:14dvh;background:#3fae55;border-top:5px solid var(--ink);z-index:3;
    background-image:radial-gradient(rgba(0,0,0,.12) 20%,transparent 22%);background-size:14px 14px}
  #status{position:absolute;top:max(14px,env(safe-area-inset-top,0px) + 8px);left:50%;translate:-50% 0;z-index:12;white-space:nowrap}
  #nextBtn{position:absolute;left:50%;bottom:calc(7dvh - 28px);translate:-50% 0;z-index:12;opacity:0;visibility:hidden;transition:opacity .3s}
  #nextBtn.show{opacity:1;visibility:visible}

  #plane{position:absolute;left:50%;bottom:calc(14dvh - 6px);width:230px;z-index:5;transform:translate(-50%,0)}
  #plane svg{display:block;width:100%;height:auto}
  #stage.cruise #plane svg{animation:bob2 .9s ease-in-out infinite alternate}
  @keyframes bob2{to{transform:translateY(-7px)}}
  #pface{opacity:0;transition:opacity .4s}
  #pface.on{opacity:1}

  .hero{position:absolute;left:-90px;bottom:calc(14dvh - 4px);width:66px;z-index:6;transform-origin:50% 100%;transition:left var(--wt,2.4s) linear,opacity .35s,transform .35s}
  .hero svg{display:block;width:66px;height:132px;overflow:visible}
  .hero.left svg{transform:scaleX(-1)}
  .hero.boarded{opacity:0;transform:scale(.2)}
  .hero.walk{animation:stepbob .35s ease-in-out infinite alternate}
  @keyframes stepbob{to{margin-bottom:4px}}
  .hero .legL,.hero .armR{animation:swing .35s ease-in-out infinite alternate paused}
  .hero .legR,.hero .armL{animation:swing .35s ease-in-out infinite alternate-reverse paused}
  .hero.walk .leg,.hero.walk .arm{animation-play-state:running}
  @keyframes swing{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
  .hb{position:absolute;right:-4px;bottom:calc(100% + 6px);width:max-content;max-width:150px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 10px;
    font-size:14px;line-height:1.2;opacity:0;transform:scale(.6);transform-origin:90% 100%;transition:opacity .25s,transform .25s;pointer-events:none}
  .hb.on{opacity:1;transform:scale(1)}
  .hb::after{content:"";position:absolute;right:22px;bottom:-13px;border:7px solid transparent;border-top:13px solid var(--ink);border-bottom:0}

  #cards{position:absolute;left:0;right:0;top:max(64px,env(safe-area-inset-top,0px) + 56px);display:flex;justify-content:center;gap:14px;z-index:4;pointer-events:none}
  .card{position:relative;background:#fff;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:6px 6px 4px;transform:rotate(var(--r,0deg));
    animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
  .card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border:2px solid var(--ink)}
  .card p{font-family:'Bangers','Impact',sans-serif;font-weight:400;letter-spacing:.04em;font-size:clamp(15px,4.2vw,19px);line-height:1.1;padding:5px 2px 2px;text-align:center}
  .card .sfx{position:absolute;left:-20px;top:-22px;width:88px;height:88px;display:flex;align-items:center;justify-content:center;background:var(--red);color:var(--yellow);
    font-size:21px;text-shadow:2px 2px 0 var(--ink);transform:rotate(-10deg);animation:slam .45s .4s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.6) rotate(-8deg)}}
  @keyframes slam{from{opacity:0;transform:scale(2.4) rotate(-30deg)}}

  #final{position:absolute;left:0;right:0;top:max(60px,env(safe-area-inset-top,0px) + 50px);bottom:18dvh;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 16px;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s}
  #final.show{opacity:1;visibility:visible}
  .candle{position:relative;width:14px;height:40px;background:linear-gradient(#ffb3cf,#ff6b9d);border:3px solid var(--ink);margin:0 auto}
  .flame{position:absolute;left:50%;top:-30px;width:16px;height:28px;margin-left:-8px;transform-origin:50% 100%;
    background:radial-gradient(#fff6c8,#ffb300 60%,transparent 72%);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:flick .25s infinite alternate;transition:opacity .3s}
  .flame.off{opacity:0;animation:none}
  @keyframes flick{from{transform:rotate(-3deg) scale(1)}to{transform:rotate(3deg) scale(.9,1.1)}}
  .cakebase{width:120px;height:40px;background:var(--red);border:4px solid var(--ink);border-top:10px solid #fff;margin:0 auto}
  #wishTitle{font-size:clamp(28px,8.5vw,42px);color:#fff;margin-top:10px;text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
  #final .cap{margin-top:10px}
  .from{margin-top:12px;font-size:22px;color:var(--yellow);text-shadow:2px 2px 0 var(--ink)}
  .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
  .row .btn{font-size:20px;padding:7px 18px}

  @media (prefers-reduced-motion:reduce){.cloud,.flame,.wheel{animation:none}.card,.card .sfx{animation:none}}
</style>
</head>
<body>

<canvas id="fw"></canvas>

<section id="cover">
  <div class="burst"></div>
  <h1 class="title" id="coverTitle"></h1>
  <div class="banner bang">The Birthday Flight</div>
  <p class="cap" id="coverCap"></p>
  <button class="btn" id="startBtn">Start the mission</button>
</section>

<div id="stage">
  <div id="clouds"></div>
  <div id="ground"></div>
  <div class="tag" id="status"></div>
  <div id="cards"></div>
  <div id="plane"></div>
  <div class="hero" id="hero"></div>
  <div id="final">
    <div class="candle"><div class="flame" id="flame"></div></div>
    <div class="cakebase"></div>
    <h2 class="bang" id="wishTitle"></h2>
    <p class="cap" id="letter"></p>
    <p class="from bang" id="from"></p>
    <div class="row"><button class="btn" id="blowBtn">Blow the candle</button><button class="btn" id="againBtn" style="background:#243b9b">Fly again</button></div>
  </div>
  <button class="btn" id="nextBtn">Next flight</button>
</div>

hero.innerHTML = HERO;

<path d="M16 36 L2 8 L36 8 L58 34Z" fill="#e63946" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
<path d="M104 70 L150 94 L178 94 L146 70Z" fill="#ffd60a" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
<path d="M10 54 Q10 34 60 32 L196 32 Q252 36 256 54 Q252 72 196 74 L60 74 Q10 74 10 54Z" fill="#fff" stroke="#111" stroke-width="3"/>
<path d="M24 58 L240 58" stroke="#e63946" stroke-width="6"/>
<circle cx="70" cy="46" r="6" fill="#9ad6ff" stroke="#111" stroke-width="2"/><circle cx="95" cy="46" r="6" fill="#9ad6ff" stroke="#111" stroke-width="2"/><circle cx="120" cy="46" r="6" fill="#9ad6ff" stroke="#111" stroke-width="2"/>
<rect x="150" y="38" width="20" height="32" rx="4" fill="#fff6c8" stroke="#111" stroke-width="2.5"/>

<circle cx="84" cy="80" r="6" fill="#111"/><circle cx="196" cy="80" r="6" fill="#111"/></svg>`;
plane.innerHTML = PLANE;
const pface = $('pface'), hb = $('hb');

/* clouds */
const cl = $('clouds');
[[8,15],[20,22],[34,17],[12,28],[44,20]].forEach(([top,dur],i)=>{
  const c = document.createElement('div'); c.className = 'cloud';
  c.style.top = top + 'dvh'; c.style.animationDuration = (dur+8) + 's'; c.style.animationDelay = (-i*5.5) + 's';
  cl.appendChild(c);
});

/* ---------- Sound ---------- */
let ac;
function audio(){ if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }
function noise(dur,type,freq,vol,curve){
  const a = audio(), len = a.sampleRate*dur, buf = a.createBuffer(1,len,a.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len,curve||2.5);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = a.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(a.destination); src.start();
}
function tone(freq,t0,dur,vol,type){
  const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = type||'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
const boom = () => noise(.6,'lowpass',500+Math.random()*500,.7);
const chime = () => { tone(880,0,.5,.18); tone(660,.28,.6,.18); };
const engine = ms => noise(ms/1000,'lowpass',260,.55,.6);
const thud = () => noise(.3,'lowpass',200,.7);
function pow(){
  const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type='square'; o.frequency.setValueAtTime(420,t); o.frequency.exponentialRampToValueAtTime(110,t+.18);
  g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.2);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.22); noise(.15,'lowpass',900,.4);
}
function whistle(){
  const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type='sine'; o.frequency.setValueAtTime(500,t); o.frequency.exponentialRampToValueAtTime(1600,t+.7);
  g.gain.setValueAtTime(.05,t); g.gain.linearRampToValueAtTime(0,t+.7);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.7);
}
function tune(){
  const N = {C:261.63,D:293.66,E:329.63,F:349.23,G:392,A:440,B:466.16,H:523.25};
  const seq = [['C',.5],['C',.25],['D',1],['C',1],['F',1],['E',2],
               ['C',.5],['C',.25],['D',1],['C',1],['G',1],['F',2],
               ['C',.5],['C',.25],['H',1],['A',1],['F',1],['E',1],['D',1],
               ['B',.5],['B',.25],['A',1],['F',1],['G',1],['F',2]];
  let t = .1; const beat = .38;
  seq.forEach(([n,d])=>{ tone(N[n],t,d*beat,.18,'triangle'); t += d*beat; });
}

/* ---------- Fireworks ---------- */
const fc = $('fw'), fx = fc.getContext('2d');
function sizeFw(){ fc.width = innerWidth; fc.height = innerHeight; }
sizeFw(); addEventListener('resize',sizeFw);
let rockets = [], sparks = [], running = false, launcher = null, stopper = null;
const COLORS = ['#ffd60a','#ff6b9d','#6bf0ff','#9dff6b','#c79bff','#ff9f43','#ffffff'];
function launch(){
  rockets.push({x:fc.width*(.12+Math.random()*.76), y:fc.height+10, vy:-(fc.height*(.012+Math.random()*.004)),
    top:fc.height*(.1+Math.random()*.4), c:COLORS[Math.random()*COLORS.length|0]});
  whistle();
}
function burst(x,y,c){
  boom();
  for(let i=0;i<70;i++){
    const ang = Math.PI*2*i/70, sp = 1.5+Math.random()*4.2;
    sparks.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1,c:Math.random()<.3?'#fff':c});
  }
}
function frame(){
  fx.globalCompositeOperation='destination-out'; fx.fillStyle='rgba(0,0,0,.22)'; fx.fillRect(0,0,fc.width,fc.height);
  fx.globalCompositeOperation='lighter';
  rockets = rockets.filter(r=>{
    r.y += r.vy; fx.fillStyle = r.c; fx.fillRect(r.x-1.5,r.y,3,12);
    if(r.y <= r.top){ burst(r.x,r.y,r.c); return false; }
    return true;
  });
  sparks = sparks.filter(s=>{
    s.x += s.vx; s.y += s.vy; s.vy += .06; s.vx *= .985; s.life -= .011;
    fx.globalAlpha = Math.max(s.life,0); fx.fillStyle = s.c;
    fx.beginPath(); fx.arc(s.x,s.y,2.2,0,7); fx.fill();
    return s.life > 0;
  });
  fx.globalAlpha = 1;
  if(running || rockets.length || sparks.length) requestAnimationFrame(frame);
}
function startFireworks(ms){
  running = true; clearInterval(launcher); clearTimeout(stopper);
  launch(); launcher = setInterval(launch,700); requestAnimationFrame(frame);
  if(ms) stopper = setTimeout(stopFireworks, ms);
}
function stopFireworks(){ running = false; clearInterval(launcher); clearTimeout(stopper); }

/* ---------- Journey ---------- */
let tok = 0, placeEl = null;
const wait = ms => { const t = tok; return new Promise((res,rej)=>setTimeout(()=> t===tok ? res() : rej('stale'), ms)); };
const nextFrame = () => new Promise(r => requestAnimationFrame(()=>requestAnimationFrame(r)));
const DOORX = 'calc(50% - 8px)', EXITX = 'calc(50% + 105px)';

function setStatus(t){ $('status').textContent = t; }
function setPlane(tr, ms, ease){
  plane.style.transition = ms ? `transform ${ms}ms ${ease||'ease'}` : 'none';
  plane.style.transform = tr;
}
function newPlace(key){
  const d = document.createElement('div'); d.className = 'place'; d.innerHTML = ART[key]();
  stage.insertBefore(d, $('ground')); return d;
}
async function swapPlace(key, ms){
  const old = placeEl, nw = newPlace(key);
  nw.style.transform = 'translateX(100%)';
  void nw.offsetWidth;
  nw.style.transition = old.style.transition = `transform ${ms}ms linear`;
  nw.style.transform = 'translateX(0)'; old.style.transform = 'translateX(-100%)';
  placeEl = nw;
  setTimeout(()=>old.remove(), ms+200);
}
async function walkTo(x, faceLeft, ms){
  hero.classList.toggle('left', faceLeft);
  hero.style.setProperty('--wt', ms+'ms');
  hero.classList.add('walk'); hero.style.left = x;
  await wait(ms);
  hero.classList.remove('walk');
}
function clearCards(){ cards.innerHTML = ''; }
function showCards(list, sfx){
  clearCards();
  const n = list.length;
  const w = Math.max(110, Math.min(innerWidth*(n===1?.56:.42), (innerHeight*.5-72)*.75));
  list.forEach((c,i)=>{
    const d = document.createElement('div'); d.className = 'card';
    d.style.width = w + 'px'; d.style.setProperty('--r', (n===1 ? 2 : (i? 3 : -3)) + 'deg');
    d.style.animationDelay = (i*.25) + 's'; if(i) d.style.marginTop = '18px';
    d.innerHTML = `<img src="${PHOTOS[c.p]}" alt=""><p>${c.t}</p>` + (i===0 && sfx ? `<div class="sfx">${sfx}</div>` : '');
    cards.appendChild(d);
  });
  setTimeout(()=>{ try{ pow(); }catch(e){} }, 450);
}
function waitNext(label){
  const b = $('nextBtn'); b.textContent = label; b.classList.add('show');
  return new Promise(res => { b.onclick = () => { b.classList.remove('show'); audio(); res(); }; });
}

async function leg(i){
  const d = TRIP[i];
  hb.classList.remove('on'); clearCards();
  setStatus('Next stop: ' + d.name);
  await walkTo(DOORX, i>0, i>0 ? 1800 : 2600);
  chime(); hero.classList.add('boarded'); pface.classList.add('on');
  await wait(900);
  setStatus('Flying to ' + d.name + '...');
  engine(2600);
  stage.classList.add('cruise');
  setPlane('translate(-30%,-34dvh) rotate(-9deg)', 2200, 'cubic-bezier(.5,0,.9,.6)');
  await wait(2000);
  stage.classList.add('fast');
  setPlane('translate(-50%,-36dvh) rotate(0deg)', 1200, 'ease-out');
  await swapPlace(d.art, 3400);
  await wait(3500);
  stage.classList.remove('fast');
  setPlane('translate(-50%,0) rotate(0deg)', 2400, 'cubic-bezier(.3,.1,.4,1)');
  await wait(2500);
  stage.classList.remove('cruise'); thud();
  setStatus(d.name);
  hero.classList.remove('boarded'); pface.classList.remove('on');
  await wait(450);
  await walkTo(EXITX, false, 1500);
  hb.textContent = d.say; hb.classList.add('on');
  if(d.final){
    await wait(1200);
    engine(2400);
    setPlane('translate(150vw,-30dvh) rotate(-8deg)', 2400, 'cubic-bezier(.5,0,.9,.6)');
    await wait(1500);
    $('final').classList.add('show'); startFireworks(7000); tune();
    return;
  }
  showCards(d.cards, d.sfx);
  await waitNext(d.btn);
}
async function journey(){
  const t = tok;
  try{ for(let i=0;i<TRIP.length;i++){ await leg(i); } }catch(e){ if(e!=='stale') console.error(e); }
}

let lit = true;
function initStage(){
  stopFireworks(); rockets = []; sparks = []; fx.clearRect(0,0,fc.width,fc.height);
  stage.classList.remove('cruise','fast');
  document.querySelectorAll('.place').forEach(p=>p.remove());
  placeEl = newPlace('home');
  setPlane('translate(-50%,0)', 0);
  hero.style.transition = 'none'; hero.classList.remove('boarded','walk','left'); hero.style.left = '-90px';
  void hero.offsetWidth; hero.style.transition = '';
  pface.classList.remove('on'); hb.classList.remove('on'); clearCards(); setStatus('');
  $('final').classList.remove('show'); $('nextBtn').classList.remove('show');
  lit = true; $('flame').classList.remove('off');
  $('wishTitle').textContent = 'Make a wish, ' + NAME; $('blowBtn').textContent = 'Blow the candle';
}
function resetAll(){
  tok++; initStage();
  if(ac){ try{ ac.close(); }catch(e){} ac = null; }
  $('cover').classList.remove('hide');
}
$('startBtn').onclick = () => {
  audio(); chime(); tok++; initStage();
  $('cover').classList.add('hide');
  setTimeout(journey, 500);
};
$('blowBtn').onclick = () => {
  audio();
  if(lit){
    $('flame').classList.add('off'); boom();
    $('wishTitle').textContent = 'Your wish is on its way!'; $('blowBtn').textContent = 'Light the candle again';
    startFireworks(5000);
  } else {
    $('flame').classList.remove('off');
    $('wishTitle').textContent = 'Make a wish, ' + NAME; $('blowBtn').textContent = 'Blow the candle';
  }
  lit = !lit;
};
$('againBtn').onclick = resetAll;

initStage();
document.addEventListener('visibilitychange', resetAll);
addEventListener('pagehide', resetAll);
addEventListener('pageshow', resetAll);
</script>
